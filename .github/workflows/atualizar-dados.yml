name: Atualizar dados dos indicadores

on:
  workflow_dispatch:

# Permissões necessárias para o bot poder commitar
permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar o script de coleta
        run: |
          cd python/scripts
          python gerar_dados.py

      - name: Verificar se houve mudanças no dados.json
        id: verificar
        run: |
          if git diff --quiet data/dados.json; then
            echo "mudou=false" >> $GITHUB_OUTPUT
          else
            echo "mudou=true" >> $GITHUB_OUTPUT
          fi

      - name: Commitar e fazer push (se houve mudança)
        if: steps.verificar.outputs.mudou == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dados.json
          git commit -m "chore: atualiza dados automaticamente [skip ci]"
          git push
